name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar (warnings viram erro)
        run: gcc -Wall -Wextra -Werror -o caixa src/caixa_eletronico.c
      - name: Rodar testes automaticos
        run: bash tests/run_tests.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar executavel
        run: gcc -Wall -Wextra -Werror -o caixa src/caixa_eletronico.c
      - uses: actions/upload-artifact@v4
        with:
          name: caixa-linux
          path: caixa

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: caixa-linux
      - name: Anexar executavel a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv caixa caixa-eletronico-linux
          gh release upload "${{ github.event.release.tag_name }}" caixa-eletronico-linux --repo "$GITHUB_REPOSITORY" --clobber
